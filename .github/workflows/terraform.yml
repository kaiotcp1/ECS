name: Terraform

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fargateflow-runtime-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '761018861028'
  AWS_ROLE_ARN: arn:aws:iam::761018861028:role/github-actions-deploy-role
  TF_IN_AUTOMATION: 'true'

jobs:
  validate:
    name: Validate Terraform
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote backend
        working-directory: infra
        run: terraform init -backend=false

      - name: Validate configuration
        working-directory: infra
        run: terraform validate

  plan:
    name: Plan Terraform
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      provision_infrastructure: ${{ steps.provisioning.outputs.enabled }}
      destroy_infrastructure: ${{ steps.provisioning.outputs.destroy_enabled }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Read lifecycle gates
        id: provisioning
        working-directory: infra
        run: |
          enabled="$(sed -nE 's/^provision_infrastructure[[:space:]]*=[[:space:]]*(true|false)[[:space:]]*$/\1/p' environments/study.tfvars)"
          destroy_enabled="$(sed -nE 's/^destroy_infrastructure[[:space:]]*=[[:space:]]*(true|false)[[:space:]]*$/\1/p' environments/study.tfvars)"
          test "$enabled" = "true" || test "$enabled" = "false"
          test "$destroy_enabled" = "true" || test "$destroy_enabled" = "false"

          if [[ "$enabled" == "true" && "$destroy_enabled" == "true" ]]; then
            echo "provision_infrastructure and destroy_infrastructure cannot both be true."
            exit 1
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "destroy_enabled=$destroy_enabled" >> "$GITHUB_OUTPUT"

          if [[ "$enabled" == "true" ]]; then
            echo "Infrastructure provisioning is enabled."
          else
            echo "Infrastructure provisioning is disabled; apply will be skipped."
          fi

          if [[ "$destroy_enabled" == "true" ]]; then
            echo "Infrastructure destruction is enabled; the governance workflow will run."
          fi

      - name: Configure Terraform AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Initialize remote backend
        working-directory: infra
        run: terraform init -input=false

      - name: Create execution plan
        working-directory: infra
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan -var-file="environments/study.tfvars"
          exit_code=$?
          set -e

          if [[ $exit_code -eq 1 ]]; then
            exit 1
          fi

          if [[ $exit_code -eq 2 ]]; then
            echo "Terraform detected infrastructure changes."
          else
            echo "Terraform state matches the configuration."
          fi

  apply:
    name: Apply Terraform runtime
    if: >-
      needs.plan.outputs.provision_infrastructure == 'true' &&
      needs.plan.outputs.destroy_infrastructure != 'true'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Configure Terraform AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: terraform-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Initialize remote backend
        working-directory: infra
        run: terraform init -input=false

      - name: Apply reviewed configuration
        working-directory: infra
        run: |
          terraform plan -input=false -out=tfplan -var-file="environments/study.tfvars"
          terraform apply -input=false tfplan
