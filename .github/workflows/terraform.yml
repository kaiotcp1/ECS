name: Terraform

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fargateflow-runtime-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '761018861028'
  AWS_ROLE_ARN: arn:aws:iam::761018861028:role/github-actions-deploy-role
  TF_IN_AUTOMATION: 'true'

jobs:
  validate:
    name: Validate Terraform
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.59.1

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote backend
        working-directory: infra
        run: terraform init -backend=false

      - name: Validate configuration
        working-directory: infra
        run: terraform validate

      - name: Initialize TFLint rules
        run: tflint --init

      - name: Lint Terraform
        run: tflint --format compact

      - name: Scan Terraform security configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  plan:
    name: Plan Terraform
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      provision_infrastructure: ${{ steps.provisioning.outputs.enabled }}
      destroy_infrastructure: ${{ steps.provisioning.outputs.destroy_enabled }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Read lifecycle gates
        id: provisioning
        working-directory: infra
        run: |
          enabled="$(sed -nE 's/^[[:space:]]*provision_infrastructure[[:space:]]*=[[:space:]]*(true|false)[[:space:]]*$/\1/p' locals.tf)"
          destroy_enabled="$(sed -nE 's/^[[:space:]]*destroy_infrastructure[[:space:]]*=[[:space:]]*(true|false)[[:space:]]*$/\1/p' locals.tf)"
          test "$enabled" = "true" || test "$enabled" = "false"
          test "$destroy_enabled" = "true" || test "$destroy_enabled" = "false"

          if [[ "$enabled" == "true" && "$destroy_enabled" == "true" ]]; then
            echo "provision_infrastructure and destroy_infrastructure cannot both be true."
            exit 1
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "destroy_enabled=$destroy_enabled" >> "$GITHUB_OUTPUT"

          if [[ "$enabled" == "true" ]]; then
            echo "Infrastructure provisioning is enabled."
          else
            echo "Infrastructure provisioning is disabled; apply will be skipped."
          fi

          if [[ "$destroy_enabled" == "true" ]]; then
            echo "Infrastructure destruction is enabled; the governance workflow will run."
          fi

      - name: Configure Terraform AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Initialize remote backend
        working-directory: infra
        run: terraform init -input=false

      - name: Create execution plan
        id: execution-plan
        working-directory: infra
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          exit_code=$?
          set -e

          if [[ $exit_code -eq 1 ]]; then
            exit 1
          fi

          if [[ $exit_code -eq 2 ]]; then
            echo "Terraform detected infrastructure changes."
          else
            echo "Terraform state matches the configuration."
          fi

      - name: Write plan summary
        working-directory: infra
        run: |
          set -euo pipefail

          terraform show -json tfplan > tfplan.json

          created="$(jq '[.resource_changes[]? | select(.change.actions == ["create"])] | length' tfplan.json)"
          updated="$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' tfplan.json)"
          deleted="$(jq '[.resource_changes[]? | select(.change.actions == ["delete"])] | length' tfplan.json)"
          replaced="$(jq '[.resource_changes[]? | select((.change.actions | index("create")) and (.change.actions | index("delete")))] | length' tfplan.json)"

          {
            echo "### Terraform plan"
            echo
            echo "| Acao | Recursos |"
            echo "| --- | ---: |"
            echo "| Criar | ${created} |"
            echo "| Atualizar | ${updated} |"
            echo "| Remover | ${deleted} |"
            echo "| Substituir | ${replaced} |"
            echo
            echo "- provision_infrastructure: \`${{ steps.provisioning.outputs.enabled }}\`"
            echo "- destroy_infrastructure: \`${{ steps.provisioning.outputs.destroy_enabled }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply Terraform runtime
    if: >-
      needs.plan.outputs.provision_infrastructure == 'true' &&
      needs.plan.outputs.destroy_infrastructure != 'true'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Configure Terraform AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: terraform-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Initialize remote backend
        working-directory: infra
        run: terraform init -input=false

      - name: Apply reviewed configuration
        working-directory: infra
        run: |
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan
